[package]
name = "musyc-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "musyc 的 ratatui 界面、事件循环与 MPRIS"
readme.workspace = true
repository.workspace = true

[dependencies]
musyc-core = { path = "../musyc-core" }
musyc-api = { path = "../musyc-api" }
musyc-player = { path = "../musyc-player" }
musyc-library = { path = "../musyc-library" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ratatui.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
tracing.workspace = true
unicode-width.workspace = true
chrono.workspace = true
ferrous-opencc = { version = "0.4.0", features = ["full"] }

# MPRIS 依赖 D-Bus，仅在 Linux 桌面启用；其他平台保留空实现。
[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.11"
